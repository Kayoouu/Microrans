# Cylindre, Re = 20, stationnaire — référence : Cd ≈ 2.05 (Dennis & Chang 1970)
# microrans run2d cylindre_re20.toml
[mesh]
type = "ogrid"
n_around = 96
n_radial = 64
farfield_radius = 40.0
first_height = 0.01

[[bodies]]
type = "circle"
center = [0.0, 0.0]
radius = 0.5
name = "cylinder"

[physics]
reynolds = 20
reference_velocity = 1.0
reference_length = 1.0     # diamètre
model = "laminar"

[initial]
U = [1.0, 0.0]

[boundary.cylinder]
type = "wall"

[boundary.farfield]
type = "farfield"
U = [1.0, 0.0]

[solver]
mode = "steady"
max_iter = 2000
tol = 1e-6

[output]
directory = "results/cylindre_re20"
forces = ["cylinder"]
