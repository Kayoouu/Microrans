# Rampe de compression supersonique M = 2, θ = 10° (Euler, compressible) : choc oblique.
# Théorie du choc oblique (NACA Report 1135) : β = 39.31°, p2/p1 = 1.7066, M2 = 1.6405.
# Mesuré (60 × 60 + 30 × 60 cellules) : voir docs/compressible.md. Durée ~15 s.
# microrans run2d compressible_rampe_mach2
[mesh]
type = "blocks"
# plancher horizontal de x = 0 à 0.5, puis rampe à 10° jusqu'à x = 1.5 (tan 10° = 0.17633)
vertices = [[0.0, 0.0], [0.5, 0.0], [1.5, 0.176327], [1.5, 1.0], [0.5, 1.0], [0.0, 1.0]]
blocks = [
  { vertices = [0, 1, 4, 5], cells = [30, 60] },
  { vertices = [1, 2, 3, 4], cells = [60, 60] },
]

[mesh.patches]
inlet = { type = "patch", faces = [[5, 0]] }
outlet = { type = "patch", faces = [[2, 3]] }
top = { type = "patch", faces = [[3, 4], [4, 5]] }
ramp = { type = "wall", faces = [[0, 1], [1, 2]] }

[physics]
compressible = true
reference_length = 1.0

[flow]
mach = 2.0
pressure = 101325.0          # Pa
temperature = 288.15         # K
viscosity = "inviscid"       # Euler

[boundary.inlet]
type = "supersonic_inlet"    # état amont imposé

[boundary.outlet]
type = "supersonic_outlet"   # extrapolation

[boundary.top]
type = "farfield"            # invariants de Riemann

[boundary.ramp]
type = "slip_wall"           # paroi glissante (Euler)

[solver]
mode = "steady"
flux = "roe"
order = 2
limiter = "venkatakrishnan"
cfl = 2.0
max_iter = 3000
tol = 1e-8
log_every = 200

[output]
directory = "results/compressible_rampe_mach2"
forces = ["ramp"]
