# Profil NACA 0012 transsonique, M = 0.8, α = 1.25° (Euler, compressible, schéma implicite).
# Valeurs publiées (ordres de grandeur, non revérifiés) : Cl ≈ 0.35, Cd ≈ 0.022-0.023.
# Ce code : Cl = 0.335, Cd = 0.0221 sur ce maillage (192 × 64 = 12 288 cellules), quasi
# inchangés sur 384 × 128 : Cl ~4.5 % trop bas, écart NON expliqué (docs/compressible.md
# § 3.5). Durée ~1 min.
# microrans run2d compressible_naca0012_transsonique
[mesh]
type = "ogrid"
n_around = 192
n_radial = 64
farfield_radius = 30.0
first_height = 2e-3

[[bodies]]
type = "naca"
code = "0012"
chord = 1.0
name = "airfoil"

[physics]
compressible = true
angle_of_attack = 1.25       # oriente l'écoulement amont ; Cd, Cl en axes vent
reference_length = 1.0       # corde

[flow]
mach = 0.8
pressure = 101325.0
temperature = 288.15
viscosity = "inviscid"

[boundary.airfoil]
type = "slip_wall"

[boundary.farfield]
type = "farfield"
vortex = [0.25, 0.0]         # correction de tourbillon ponctuel (quart de corde) : C_l
                             # indépendant de la taille du domaine

[solver]
mode = "steady"
flux = "roe"
order = 2
limiter = "venkatakrishnan"   # NON gelé : un limiteur gelé avant que le choc soit en place
                             # fausse la solution convergée (limiter_freeze = 200 : C_l
                             # −3.4 % avec des résidus pourtant tombés à 1e-10)
venkat_k = 0.3               # seuil du limiteur ; avec le défaut 0.05, le limiteur agit
                             # aussi hors du choc : 96 × 32 : C_l −5 % et deux solutions
                             # stationnaires (implicite 0.3139, RK3 0.3162) ; 0.3 : solution
                             # unique, à 0.02 % de celle sans limiteur (docs/compressible.md
                             # § 3.5)
steady_scheme = "implicit"
cfl = 5.0
cfl_max = 100.0
max_iter = 1000
tol = 1e-6
monitor_tol = 1e-5           # ou efforts stabilisés (relatif) sur 200 itérations
log_every = 50

[output]
directory = "results/compressible_naca0012_transsonique"
forces = ["airfoil"]
moment_center = [0.25, 0.0]
