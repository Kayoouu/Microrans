# Sphère, Re = 100, calcul axisymétrique (x = axe, y = rayon) : ~2 s.
# Référence : Cd = 1.085 (Fornberg 1988) ; microrans : 1.092 (4 096 cellules), 1.090 (9 216).
# Le maillage en O autour d'un disque est coupé à l'axe (cut_axis) : seule la moitié y > 0
# est calculée, la coupe devient la frontière « axis ».
# microrans run2d sphere_re100_axisym
[mesh]
type = "ogrid"
n_around = 128               # pair : la coupe suit des lignes du maillage
n_radial = 64
farfield_radius = 30.0
first_height = 0.005
cut_axis = true

[[bodies]]
type = "circle"
center = [0.0, 0.0]
radius = 0.5
name = "sphere"

[physics]
reynolds = 100
reference_velocity = 1.0
reference_length = 1.0       # diamètre ; Cd rapporté au maître-couple π D²/4
axisymmetric = true

[initial]
U = [1.0, 0.0]

[boundary.sphere]
type = "wall"

[boundary.axis]
type = "axis"

[boundary.farfield]
type = "farfield"
U = [1.0, 0.0]

[solver]
mode = "steady"
max_iter = 2000
tol = 1e-6

[output]
directory = "results/sphere_re100_axisym"
forces = ["sphere"]
