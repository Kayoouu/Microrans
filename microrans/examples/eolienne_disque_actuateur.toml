# Éolienne représentée par un disque actuateur (théorie de Froude), axisymétrique : ~5 s.
# C_T = 0.5 → facteur d'induction a = 0.146, vitesse au disque U∞(1 − a) = 0.854, puissance
# C_P = 4a(1 − a)² = 0.427. microrans (Re = U∞R/ν = 100, 120 × 60) : vitesse au disque et
# puissance −0.8 % (240 × 120 : +0.8 % ; Re = 500 : +0.1 %). « actuator_disks » dans
# summary.json ; sillage : U.png, profil « sillage » (line_sillage.csv).
# microrans run2d eolienne_disque_actuateur
[mesh]
type = "rectangle"
x0 = -20.0
x1 = 30.0
y0 = 0.0
y1 = 10.0
nx = 120
ny = 60
# raffinement près du disque : (fraction de longueur, fraction de cellules, rapport)
grading = [[[0.36, 0.25, 0.125], [0.08, 0.35, 1.0], [0.56, 0.40, 10.0]],
           [[0.15, 0.5, 1.0], [0.85, 0.5, 15.0]]]
names = { left = "inlet", right = "outlet", bottom = "axis", top = "top" }

[physics]
nu = 0.01                    # Re = U∞ R / ν = 100
axisymmetric = true
reference_velocity = 1.0
reference_length = 2.0       # diamètre

[[actuator_disk]]
name = "rotor"
x0 = -0.075
x1 = 0.075
radius = 1.0
thrust_coefficient = 0.5
mode = "turbine"             # la poussée s'oppose à l'écoulement

[initial]
U = [1.0, 0.0]

[boundary.inlet]
type = "inlet"
U = [1.0, 0.0]

[boundary.outlet]
type = "outlet"

[boundary.axis]
type = "axis"

[boundary.top]
type = "symmetry"

[solver]
mode = "steady"
max_iter = 2000
tol = 1e-7

[output]
directory = "results/eolienne_disque_actuateur"
lines = [{ name = "sillage", start = [-10.0, 0.0], end = [25.0, 0.0], n = 200 }]
