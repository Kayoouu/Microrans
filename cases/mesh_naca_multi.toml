# Deux objets : un profil NACA 2412 à 4° d'incidence et un profil importé (fichier Selig)
# microrans mesh cases/mesh_naca_multi.toml --type unstructured
[mesh]
type = "hybrid"
h_max = 0.5
h_surface = 0.01
growth = 0.15
layers = { n = 15, first_height = 5e-5, ratio = 1.25 }

[domain]
type = "rectangle"
x0 = -4.0
y0 = -4.0
x1 = 8.0
y1 = 4.0
names = { left = "inlet", right = "outlet", bottom = "bottom", top = "top" }

[[bodies]]
type = "naca"
code = "2412"
chord = 1.0
incidence = 4.0
rotation_center = [0.25, 0.0]
name = "main"

[[bodies]]
type = "file"
path = "profil_volet.dat"      # contour importé (.dat Selig/Lednicer, .csv, .svg, .dxf)
scale = 0.3
incidence = 20.0
translate = [1.05, -0.12]
name = "flap"
