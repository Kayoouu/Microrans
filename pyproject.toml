[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "microrans"
version = "0.1.0"
description = "Solveur RANS/URANS 1D et 2D (volumes finis) avec mailleur : Spalart-Allmaras, k-epsilon, k-omega, SST"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5", "pyamg>=4.2",
                "tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
microrans = "microrans.cli:main"

[tool.setuptools.packages.find]
include = ["microrans*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
