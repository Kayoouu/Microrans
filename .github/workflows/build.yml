name: executables

# Construit les exécutables (interface graphique + ligne de commande) pour Windows et Linux
# avec PyInstaller (macOS retiré : pas d'utilisateurs visés ; installation Python possible), les teste (calcul + auto-test de l'interface hors écran) et les
# publie comme artefacts. Quand une « release » est publiée sur GitHub (onglet Releases →
# Draft a new release → tag v0.2.0 → Publish), les archives et les notes de version
# (packaging/RELEASE_NOTES.md) y sont attachées automatiquement.
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: ["**"]
    paths: ["packaging/**", ".github/workflows/build.yml"]

# Jeton en lecture seule par défaut ; seule la publication d'une release écrit.
# Actions tierces épinglées par empreinte de commit (une étiquette « v2 » peut être
# déplacée par un attaquant qui compromet le dépôt de l'action) ; Dependabot les met à jour.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Bibliothèques système Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 zip
      - name: Installation
        run: pip install . "PySide6>=6.5"
      - name: PyInstaller (Windows, chargeur recompilé depuis les sources)
        # le chargeur précompilé de PyInstaller, partagé par de nombreux programmes, est une
        # cause fréquente de fausses alertes de Microsoft Defender ; le recompiler aide
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          pip install --no-binary pyinstaller "pyinstaller>=6"
      - name: PyInstaller
        if: runner.os != 'Windows'
        run: pip install "pyinstaller>=6"
      - name: Construction PyInstaller
        run: pyinstaller --noconfirm packaging/microrans.spec
      - name: Test de la ligne de commande
        shell: bash
        run: |
          ./dist/microrans/microrans examples
          ./dist/microrans/microrans run2d cavite_re100 -q --no-plot --set solver.max_iter=50 -o smoke/cli || test $? -eq 1
          test -f smoke/cli/summary.json
          # balayage sur 2 processus : lancement de processus (« spawn ») depuis l'exécutable
          ./dist/microrans/microrans sweep cavite_re100 -q --no-plot --jobs 2 --param physics.nu --values 0.01 0.02 --set mesh.nx=16 mesh.ny=16 solver.max_iter=300 -o smoke/sweep
          test -f smoke/sweep/balayage.csv
      - name: Auto-test de l'interface (Windows, affichage natif comme chez l'utilisateur)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MICRORANS_RESULTS: ${{ github.workspace }}\smoke
        run: |
          $p = Start-Process -FilePath dist\microrans\microrans-gui.exe -ArgumentList "--selftest","smoke\gui.png" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "auto-test : code $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path smoke\gui.png)) { Write-Error "pas de capture"; exit 1 }
      - name: Auto-test de l'interface (Linux, hors écran, pas d'écran sur le serveur)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MICRORANS_RESULTS: ${{ github.workspace }}/smoke
        run: |
          ./dist/microrans/microrans-gui --selftest smoke/gui.png
          test -f smoke/gui.png
      - name: Archive
        shell: bash
        run: |
          cp README.md dist/microrans/LISEZMOI.md
          cp LICENSE dist/microrans/LICENSE.txt
          cp packaging/THIRD_PARTY_NOTICES.txt dist/microrans/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip ../microrans-${{ runner.os }}.zip microrans > /dev/null; else zip -qry ../microrans-${{ runner.os }}.zip microrans; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: microrans-${{ runner.os }}
          path: microrans-${{ runner.os }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: capture-interface-${{ runner.os }}
          path: smoke/gui.png

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: microrans-*
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: microrans ${{ github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: microrans-*.zip
